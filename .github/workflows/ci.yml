name: CI

on:
  # Same stance as the other SDK repositories: pushes to main do not trigger a run (Actions bills
  # by the minute); verification happens on pull requests and at release time.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lower bound matches maven.compiler.release in the pom. Testing only the newest
        # release would leave problems for users on 17 to discover themselves - and 17 is exactly
        # what this artifact claims to support.
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # verify covers it all in one pass: compilation (-Xlint:all, warnings are failures), unit
      # tests, the contract drift check, javadoc (-Xdoclint:all) and the sources / javadoc jars.
      # The drift check compares against the public contract and needs no credentials - this
      # repository is public and must not hold a token that can read a private one.
      - name: Verify
        run: mvn -B verify

      # The declared Jackson floor is 2.12, while day-to-day development runs something newer.
      # Testing one end only means nobody learns when the other end breaks - and it breaks badly:
      # on 2.11 a record has no usable constructor at all.
      - name: Tests against a current Jackson
        run: mvn -B test -Djackson.version=2.18.2
